global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    retries 3
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout check   3s

# ------------------------------------------------- panel de estado (HTTP)
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-node
    # endpoint de metricas para Prometheus
    http-request use-service prometheus-exporter if { path /metrics }

# ------------------ punto de entrada principal: round-robin (multi-master)
listen galera_rr
    bind *:3306
    mode tcp
    balance roundrobin
    option mysql-check user haproxy_check
    default-server inter 2s fall 2 rise 3 downinter 5s
    server galera1 galera1:3306 check
    server galera2 galera2:3306 check
    server galera3 galera3:3306 check

# --------- punto de entrada alternativo: escritor unico (evita conflictos)
# Sirve para comparar en el informe round-robin vs single-writer.
listen galera_writer
    bind *:3307
    mode tcp
    balance first
    option mysql-check user haproxy_check
    default-server inter 2s fall 2 rise 3 downinter 5s
    server galera1 galera1:3306 check
    server galera2 galera2:3306 check backup
    server galera3 galera3:3306 check backup
